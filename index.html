<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スライドビューワー｜労働金庫様向け タブレット活用提案</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            background: #1a1a2e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .topbar {
            background: #002060;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #00A0E9;
            flex-shrink: 0;
            gap: 12px;
        }
        .topbar h1 {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn {
            background: #00A0E9;
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: #0080c0; }
        .nav-btn:disabled { background: #555; cursor: default; }
        .slide-counter {
            font-size: 13px;
            color: #aaa;
            min-width: 60px;
            text-align: center;
        }
        .memo-toggle-btn {
            background: #1a4a2a;
            color: #6fdc8c;
            border: 1px solid #6fdc8c;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .memo-toggle-btn:hover { background: #2a6a3a; }
        .memo-toggle-btn.active { background: #6fdc8c; color: #003010; }

        /* Main Layout */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            background: #0d0d1a;
            overflow-y: auto;
            flex-shrink: 0;
            border-right: 1px solid #333;
        }
        .sidebar-title {
            padding: 10px 12px;
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
        }
        .slide-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a2e;
            transition: background 0.15s;
            position: relative;
        }
        .slide-item:hover { background: #1a2a4a; }
        .slide-item.active { background: #002060; border-left: 3px solid #00A0E9; }
        .slide-item .slide-num {
            font-size: 9px;
            color: #00A0E9;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .slide-item .slide-name {
            font-size: 11px;
            color: #ccc;
            line-height: 1.4;
        }
        .slide-item.active .slide-name { color: #fff; }
        .slide-item .has-note {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6fdc8c;
        }

        /* Viewer Area */
        .viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 16px;
            background: #111122;
            min-width: 0;
        }
        .slide-title-bar {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            text-align: center;
        }
        .slide-title-bar span {
            color: #00A0E9;
            font-weight: 700;
        }
        .iframe-wrapper {
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        iframe {
            display: block;
            border: none;
            transform-origin: top left;
        }

        /* Notes Panel */
        .notes-panel {
            width: 0;
            background: #0d1a0d;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.25s ease;
            flex-shrink: 0;
        }
        .notes-panel.open {
            width: 300px;
        }
        .notes-inner {
            width: 300px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Tabs */
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .panel-tab {
            flex: 1;
            padding: 8px 4px;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            color: #888;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }
        .panel-tab:hover { color: #ccc; }
        .panel-tab.active { color: #6fdc8c; border-bottom-color: #6fdc8c; }

        /* Tab Contents */
        .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .tab-content.active { display: flex; }

        /* Slide Notes Tab */
        .note-slide-label {
            padding: 8px 12px;
            font-size: 10px;
            color: #6fdc8c;
            font-weight: 700;
            border-bottom: 1px solid #1a2a1a;
            flex-shrink: 0;
        }
        .note-textarea {
            flex: 1;
            background: #0d1a0d;
            color: #ccc;
            border: none;
            resize: none;
            padding: 12px;
            font-size: 12px;
            line-height: 1.7;
            font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
            outline: none;
        }
        .note-textarea::placeholder { color: #444; }
        .note-textarea:focus { background: #0f1f0f; }

        /* Global Notes Tab */
        .global-note-label {
            padding: 8px 12px;
            font-size: 10px;
            color: #aaa;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        /* Claude Proposals Tab */
        .proposals-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .proposal-item {
            background: #0f1a10;
            border: 1px solid #2a3a2a;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .proposal-priority {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .priority-high { background: #4a1010; color: #ff6b6b; }
        .priority-medium { background: #3a2a00; color: #ffc66b; }
        .priority-low { background: #1a2a3a; color: #6bb8ff; }
        .proposal-title {
            font-size: 12px;
            font-weight: 700;
            color: #e0e0e0;
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .proposal-detail {
            font-size: 11px;
            color: #888;
            line-height: 1.6;
        }
        .proposal-action-btn {
            margin-top: 6px;
            background: #1a3a2a;
            border: 1px solid #2a5a3a;
            color: #6fdc8c;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .proposal-action-btn:hover { background: #2a4a3a; }

        /* Export area */
        .export-area {
            padding: 8px;
            border-top: 1px solid #1a2a1a;
            flex-shrink: 0;
        }
        .export-btn {
            width: 100%;
            background: #002060;
            color: #00A0E9;
            border: 1px solid #00A0E9;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }
        .export-btn:hover { background: #003080; }
        .export-status {
            font-size: 10px;
            color: #6fdc8c;
            text-align: center;
            margin-top: 4px;
            min-height: 14px;
        }
    </style>
</head>
<body>

<div class="topbar">
    <h1>労働金庫様向け タブレット活用ソリューション提案 ― スライドビューワー</h1>
    <div class="topbar-right">
        <div class="nav-controls">
            <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">◀ 前へ</button>
            <span class="slide-counter" id="counter">1 / 19</span>
            <button class="nav-btn" id="nextBtn" onclick="navigate(1)">次へ ▶</button>
        </div>
        <button class="memo-toggle-btn" id="memoToggleBtn" onclick="togglePanel()">📝 メモ・提案</button>
    </div>
</div>

<div class="main">
    <div class="sidebar">
        <div class="sidebar-title">スライド一覧</div>
        <div id="slideList"></div>
    </div>
    <div class="viewer-area" id="viewerArea">
        <div class="slide-title-bar">表示中: <span id="currentTitle">-</span></div>
        <div class="iframe-wrapper" id="iframeWrapper">
            <iframe id="slideFrame" src="" width="1280" height="720"></iframe>
        </div>
    </div>
    <div class="notes-panel" id="notesPanel">
        <div class="notes-inner">
            <div class="panel-tabs">
                <div class="panel-tab active" onclick="switchTab('slide-notes')">スライドメモ</div>
                <div class="panel-tab" onclick="switchTab('global-notes')">全体メモ</div>
                <div class="panel-tab" onclick="switchTab('claude-proposals')">Claude提案</div>
            </div>

            <!-- Tab 1: Slide Notes -->
            <div class="tab-content active" id="tab-slide-notes">
                <div class="note-slide-label" id="noteSlideLabel">現在のスライドへのメモ</div>
                <textarea class="note-textarea" id="slideNoteArea"
                    placeholder="このスライドに対するコンサルの意見、質問、改善案などを記録...&#10;&#10;例：&#10;・競合比較のデータが欲しい&#10;・ROIの数値を追加すべき&#10;・次回までに事例を準備"
                    oninput="saveSlideNote()"></textarea>
                <div class="export-area">
                    <button class="export-btn" onclick="exportAllNotes()">📤 全メモをMarkdownでコピー</button>
                    <div class="export-status" id="exportStatus"></div>
                </div>
            </div>

            <!-- Tab 2: Global Notes -->
            <div class="tab-content" id="tab-global-notes">
                <div class="global-note-label">全体・議事メモ（スライドに紐付かない全体的な議論）</div>
                <textarea class="note-textarea" id="globalNoteArea"
                    placeholder="ディスカッション全体のメモ...&#10;&#10;例：&#10;【参加者の反応】&#10;・タブレット活用に前向き&#10;・コスト感が気になっている&#10;&#10;【ネクストアクション】&#10;・ROI資料を来週までに送付&#10;・担当者をBさんに設定"
                    oninput="saveGlobalNote()"></textarea>
                <div class="export-area">
                    <button class="export-btn" onclick="exportAllNotes()">📤 全メモをMarkdownでコピー</button>
                    <div class="export-status" id="exportStatus2"></div>
                </div>
            </div>

            <!-- Tab 3: Claude Proposals -->
            <div class="tab-content" id="tab-claude-proposals">
                <div class="proposals-list" id="proposalsList"></div>
            </div>
        </div>
    </div>
</div>

<script>
const slides = [
    { file: "slide01_cover.html",              label: "01 表紙" },
    { file: "slide02a_three_waves.html",        label: "02a 3つの逆風（旧）" },
    { file: "slide02b_env_change.html",         label: "02b 環境変化（新）" },
    { file: "slide03a_shrink.html",             label: "03a 効率化→シュリンク（旧）" },
    { file: "slide03b_megabank_trap.html",      label: "03b メガバンクの罠（旧）" },
    { file: "slide04a_differentiation.html",    label: "04a 差別化戦略（旧）" },
    { file: "slide04b_five_steps.html",         label: "04b 5ステップ概要（旧）" },
    { file: "slide05_management_agenda.html",   label: "05 経営アジェンダ" },
    { file: "slide06_tablet_probe.html",        label: "06 タブレット「探査機」" },
    { file: "slide07_megabank_trap.html",       label: "07 メガバンクの罠" },
    { file: "slide08_tablet_hub.html",          label: "08 情報ハブ" },
    { file: "slide09_security.html",            label: "09 セキュリティ基盤" },
    { file: "slide10_step1_contact.html",       label: "10 Step1 接点獲得" },
    { file: "slide11_step2_convenience.html",   label: "11 Step2 利便性向上" },
    { file: "slide12_step3_asset.html",         label: "12 Step3 資産形成支援" },
    { file: "slide13_step4_deepen.html",        label: "13 Step4 取引深化" },
    { file: "slide14_step5_relationship.html",  label: "14 Step5 関係性強化" },
    { file: "slide15_matrix.html",              label: "15 全体像マトリクス" },
    { file: "slide16_workshop.html",            label: "16 ワークショップ提案" },
];

// ── Claude Proposals ──────────────────────────────────────────
const claudeProposals = [
    {
        priority: "high",
        title: "ROI・数値根拠スライドの追加",
        detail: "戦略的メッセージは強いが具体的な数値が不足。クロスセル率の改善予測・LTV向上の数値例・投資対効果（ROI）試算を示す1枚を追加すると説得力が大幅向上。",
        slideHint: "slide05 の後（新 slide06 として）"
    },
    {
        priority: "high",
        title: "実装ロードマップスライドの追加",
        detail: "「いつから、何を、どのくらいで」が見えない。PoC → パイロット → 全展開の3フェーズをガントチャート形式で示すスライドが必要。",
        slideHint: "slide15（マトリクス）の後に追加"
    },
    {
        priority: "high",
        title: "旧スライド（02a/03a/03b/04a/04b）の整理",
        detail: "5枚が「旧」扱いだがビューワー前半に配置されており、コンサルや顧客が混乱する可能性。参考資料として末尾に移動、または推奨フローを明示する。",
        slideHint: "index.html のスライド順序を整理"
    },
    {
        priority: "medium",
        title: "タブレット画面モックアップの追加",
        detail: "「何ができるか」をビジュアルで示す。ヒアリングシート画面・パーソナライズ提案書生成画面のモックアップ1〜2枚を追加すると具体性が増す。",
        slideHint: "slide08（情報ハブ）の後"
    },
    {
        priority: "medium",
        title: "NTTデータの実績・参考事例スライド",
        detail: "地域金融機関でのタブレット活用導入事例を示すことで信頼性と実現可能性を訴求。類似する地銀・信金事例などを1枚で紹介する。",
        slideHint: "slide16（ワークショップ）の前"
    },
    {
        priority: "medium",
        title: "コスト感・投資フレームの提示",
        detail: "初期投資・ランニングコストの目安がないと次のアクションに踏み出しにくい。「詳細はWS後」としつつも概算フレームを示す。",
        slideHint: "ROIスライドと合わせて"
    },
    {
        priority: "low",
        title: "想定Q&A・懸念事項スライド",
        detail: "「セキュリティは？」「既存システムとの連携は？」「現場の学習コストは？」など想定QAを1枚で先回り提示。コンサルの懸念を事前に払拭できる。",
        slideHint: "slide09（セキュリティ）を拡充、またはQ&A専用スライドを追加"
    },
    {
        priority: "low",
        title: "ネクストアクションの明確化（slide16）",
        detail: "最終スライドにワークショップ日程調整ステップと担当者連絡先を追加。「次に何をすればよいか」を明示することでクロージングが強くなる。",
        slideHint: "slide16_workshop.html を編集"
    },
];

// ── Notes storage ──────────────────────────────────────────────
const STORAGE_KEY = 'rokin_notes_v1';

function loadNotes() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch(e) { return {}; }
}
function saveNotes(notes) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
}

function saveSlideNote() {
    const notes = loadNotes();
    const key = slides[current].file;
    notes[key] = document.getElementById('slideNoteArea').value;
    saveNotes(notes);
    updateSidebarDots();
}

function saveGlobalNote() {
    const notes = loadNotes();
    notes['__global__'] = document.getElementById('globalNoteArea').value;
    saveNotes(notes);
}

function loadSlideNoteIntoPanel(slideFile, slideLabel) {
    const notes = loadNotes();
    document.getElementById('slideNoteArea').value = notes[slideFile] || '';
    document.getElementById('noteSlideLabel').textContent = '📝 ' + slideLabel;
}

function loadGlobalNoteIntoPanel() {
    const notes = loadNotes();
    document.getElementById('globalNoteArea').value = notes['__global__'] || '';
}

function updateSidebarDots() {
    const notes = loadNotes();
    document.querySelectorAll('.slide-item').forEach((el, idx) => {
        const key = slides[idx].file;
        let dot = el.querySelector('.has-note');
        if (notes[key] && notes[key].trim()) {
            if (!dot) {
                dot = document.createElement('div');
                dot.className = 'has-note';
                el.appendChild(dot);
            }
        } else {
            if (dot) dot.remove();
        }
    });
}

function exportAllNotes() {
    const notes = loadNotes();
    let md = `# 労働金庫タブレット提案 — ディスカッションメモ\n`;
    md += `生成日時: ${new Date().toLocaleString('ja-JP')}\n\n`;

    const global = notes['__global__'];
    if (global && global.trim()) {
        md += `## 全体・議事メモ\n\n${global.trim()}\n\n---\n\n`;
    }

    md += `## スライド別メモ\n\n`;
    slides.forEach(s => {
        const note = notes[s.file];
        if (note && note.trim()) {
            md += `### ${s.label}\n\n${note.trim()}\n\n`;
        }
    });

    const hasAny = slides.some(s => notes[s.file] && notes[s.file].trim()) || (global && global.trim());
    if (!hasAny) {
        md += '_（メモなし）_\n';
    }

    navigator.clipboard.writeText(md).then(() => {
        const st1 = document.getElementById('exportStatus');
        const st2 = document.getElementById('exportStatus2');
        const msg = '✓ クリップボードにコピーしました';
        if (st1) st1.textContent = msg;
        if (st2) st2.textContent = msg;
        setTimeout(() => {
            if (st1) st1.textContent = '';
            if (st2) st2.textContent = '';
        }, 3000);
    }).catch(() => {
        // Fallback: open in new window
        const w = window.open('', '_blank');
        w.document.write('<pre style="font-family:monospace;white-space:pre-wrap;padding:20px">' + md.replace(/</g,'&lt;') + '</pre>');
    });
}

// ── Panel toggle ───────────────────────────────────────────────
let panelOpen = false;
function togglePanel() {
    panelOpen = !panelOpen;
    document.getElementById('notesPanel').classList.toggle('open', panelOpen);
    document.getElementById('memoToggleBtn').classList.toggle('active', panelOpen);
    if (panelOpen) {
        loadSlideNoteIntoPanel(slides[current].file, slides[current].label);
        loadGlobalNoteIntoPanel();
    }
    setTimeout(scaleFrame, 300);
}

// ── Tab switch ─────────────────────────────────────────────────
function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.panel-tab').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    const tabs = ['slide-notes', 'global-notes', 'claude-proposals'];
    tabs.forEach((t, i) => {
        if (t === tabId) document.querySelectorAll('.panel-tab')[i].classList.add('active');
    });
}

// ── Slide navigation ───────────────────────────────────────────
let current = 0;

function buildList() {
    const list = document.getElementById("slideList");
    slides.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "slide-item" + (i === 0 ? " active" : "");
        div.innerHTML = `<div class="slide-num">${s.file}</div><div class="slide-name">${s.label}</div>`;
        div.onclick = () => goTo(i);
        list.appendChild(div);
    });
    updateSidebarDots();
}

function scaleFrame() {
    const area = document.getElementById("viewerArea");
    const wrapper = document.getElementById("iframeWrapper");
    const frame = document.getElementById("slideFrame");
    const areaW = area.clientWidth - 32;
    const areaH = area.clientHeight - 60;
    const scale = Math.min(areaW / 1280, areaH / 720);
    frame.style.transform = `scale(${scale})`;
    wrapper.style.width = (1280 * scale) + "px";
    wrapper.style.height = (720 * scale) + "px";
    frame.style.transformOrigin = "top left";
}

function goTo(i) {
    // Save current notes before switching
    if (panelOpen) saveSlideNote();

    current = i;
    const s = slides[i];
    document.getElementById("slideFrame").src = s.file;
    document.getElementById("currentTitle").textContent = s.label;
    document.getElementById("counter").textContent = `${i + 1} / ${slides.length}`;
    document.getElementById("prevBtn").disabled = i === 0;
    document.getElementById("nextBtn").disabled = i === slides.length - 1;
    document.querySelectorAll(".slide-item").forEach((el, idx) => {
        el.classList.toggle("active", idx === i);
    });
    document.querySelectorAll(".slide-item")[i].scrollIntoView({ block: "nearest" });

    // Update notes panel
    if (panelOpen) {
        loadSlideNoteIntoPanel(s.file, s.label);
    }
}

function navigate(dir) {
    const next = current + dir;
    if (next >= 0 && next < slides.length) goTo(next);
}

// ── Build Claude Proposals ─────────────────────────────────────
function buildProposals() {
    const list = document.getElementById('proposalsList');
    claudeProposals.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'proposal-item';
        div.innerHTML = `
            <span class="proposal-priority priority-${p.priority}">${
                p.priority === 'high' ? '優先度：高' :
                p.priority === 'medium' ? '優先度：中' : '優先度：低'
            }</span>
            <div class="proposal-title">${p.title}</div>
            <div class="proposal-detail">${p.detail}</div>
            <div class="proposal-detail" style="margin-top:4px;color:#556655">📍 ${p.slideHint}</div>
            <button class="proposal-action-btn" onclick="copyProposalToNote(${idx})">→ このスライドのメモに転記</button>
        `;
        list.appendChild(div);
    });
}

function copyProposalToNote(idx) {
    const p = claudeProposals[idx];
    const area = document.getElementById('slideNoteArea');
    const append = `\n[Claude提案] ${p.title}\n${p.detail}\n対象: ${p.slideHint}`;
    area.value = (area.value + append).trim();
    saveSlideNote();
    switchTab('slide-notes');
}

// ── Keyboard navigation ────────────────────────────────────────
document.addEventListener("keydown", e => {
    const tag = document.activeElement.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT') return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") navigate(1);
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") navigate(-1);
});

window.addEventListener("resize", scaleFrame);
document.getElementById("slideFrame").addEventListener("load", scaleFrame);

buildList();
buildProposals();
goTo(0);
scaleFrame();
</script>
</body>
</html>
