<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タブレットの再定義：未来を探る「探査機」</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f0f4f8;
            color: #333;
        }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: white;
            position: relative;
            overflow: hidden;
            padding: 40px 60px 10px 60px;
            box-sizing: border-box;
        }
        .header-bar { position: absolute; top: 0; left: 0; width: 100%; height: 12px; background: linear-gradient(90deg, #002060 0%, #0041C2 100%); }
        .footer-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 8px; background-color: #002060; }
        .page-number { position: absolute; bottom: 12px; right: 20px; font-size: 14px; color: #666; }
        .main-title {
            font-size: 36px;
            font-weight: 700;
            color: #002060;
            margin-bottom: 10px;
            border-left: 8px solid #00A0E9;
            padding-left: 20px;
            line-height: 1.2;
        }
        .sub-title {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
            padding-left: 28px;
        }
        .redefine-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            background-color: #f7fafc;
            padding: 20px;
            border-radius: 8px;
        }
        .old-def {
            color: #718096;
            text-decoration: line-through;
            font-size: 20px;
        }
        .arrow-right {
            font-size: 30px;
            color: #00A0E9;
        }
        .new-def {
            color: #002060;
            font-size: 28px;
            font-weight: 700;
        }
        .cycle-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
            position: relative;
        }
        .cycle-step {
            text-align: center;
            width: 220px;
            position: relative;
            z-index: 2;
        }
        .step-icon {
            font-size: 40px;
            margin-bottom: 10px;
            color: #0056b3;
            background: white;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 0 auto 15px auto;
        }
        .step-title {
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
        }
        .step-desc {
            font-size: 14px;
            color: #4a5568;
        }
        .cycle-arrow {
            font-size: 24px;
            color: #cbd5e0;
        }
        .value-box {
            margin-top: 30px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #002060;
            background-color: #ebf8ff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #bee3f8;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-bar"></div>

        <div class="flex justify-between items-start mb-4">
            <div>
                <h1 class="main-title">タブレットの再定義：未来を探る「探査機」</h1>
                <p class="sub-title">単なる事務効率化ツールではなく、次の収益源を見つけるためのセンサーへ</p>
            </div>
            <div class="text-right">
                <div class="text-2xl font-bold text-[#002060] tracking-tighter">NTT DATA</div>
                <div class="text-xs text-gray-500">Trusted Global Innovator</div>
            </div>
        </div>
        <div class="redefine-box">
            <div class="old-def">事務処理・ペーパーレス化ツール</div>
            <div class="arrow-right">➡</div>
            <div class="new-def">顧客の潜在ニーズを発掘する「探査機」</div>
        </div>
        <div class="cycle-container">
            <div class="cycle-step">
                <div class="step-icon">📱</div>
                <div class="step-title">非対面ポータル</div>
                <div class="step-desc">デジタル行動データ<br>（予兆の検知）</div>
            </div>
            <div class="cycle-arrow">➡</div>
            <div class="cycle-step">
                <div class="step-icon" style="background-color: #002060; color: white;">🗣️</div>
                <div class="step-title">対面 × タブレット</div>
                <div class="step-desc">会話・ヒアリング<br>（生の声・感情）</div>
            </div>
            <div class="cycle-arrow">➡</div>
            <div class="cycle-step">
                <div class="step-icon">🧠</div>
                <div class="step-title">統合分析</div>
                <div class="step-desc">インサイト抽出<br>（真のニーズ）</div>
            </div>
            <div class="cycle-arrow">➡</div>
            <div class="cycle-step">
                <div class="step-icon">💡</div>
                <div class="step-title">新サービス創出</div>
                <div class="step-desc">次の収益源へ<br>（価値創造）</div>
            </div>
        </div>
        <div class="value-box">
            この「探査機」で得たデータを基に、労金独自の新しいサービスを創り出しませんか？
        </div>
        <div class="footer-bar"></div>
        <div class="page-number">6</div>
    </div>
</body>
</html>
