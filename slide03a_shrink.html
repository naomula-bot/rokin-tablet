<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「効率化」の先にあるのは、シュリンクではないか？</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f0f4f8;
            color: #333;
        }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: white;
            position: relative;
            overflow: hidden;
            padding: 40px 60px 10px 60px;
            box-sizing: border-box;
        }
        .header-bar { position: absolute; top: 0; left: 0; width: 100%; height: 12px; background: linear-gradient(90deg, #002060 0%, #0041C2 100%); }
        .footer-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 8px; background-color: #002060; }
        .page-number { position: absolute; bottom: 12px; right: 20px; font-size: 14px; color: #666; }
        .main-title {
            font-size: 36px;
            font-weight: 700;
            color: #002060;
            margin-bottom: 10px;
            border-left: 8px solid #e53e3e;
            padding-left: 20px;
            line-height: 1.2;
        }
        .sub-title {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
            padding-left: 28px;
        }
        .comparison-container {
            display: flex;
            gap: 40px;
            margin-top: 30px;
        }
        .comp-box {
            flex: 1;
            padding: 25px;
            border-radius: 12px;
            position: relative;
        }
        .comp-others {
            background-color: #f7fafc;
            border: 2px solid #cbd5e0;
        }
        .comp-rokin {
            background-color: #fff5f5;
            border: 2px solid #fc8181;
        }
        .comp-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .comp-others .comp-title { color: #2d3748; }
        .comp-rokin .comp-title { color: #c53030; }
        .cycle-img {
            text-align: center;
            font-size: 60px;
            margin: 20px 0;
            line-height: 1;
        }
        .cycle-text {
            font-size: 18px;
            line-height: 1.6;
            color: #4a5568;
            text-align: center;
        }
        .question-overlay {
            margin-top: 40px;
            background: linear-gradient(90deg, #002060 0%, #0041C2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(0,32,96,0.3);
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-bar"></div>

        <div class="flex justify-between items-start mb-4">
            <div>
                <h1 class="main-title">「効率化」の先にあるのは、シュリンクではないか？</h1>
                <p class="sub-title">コスト削減だけでは、組織の縮小均衡（ジリ貧）は避けられない</p>
            </div>
            <div class="text-right">
                <div class="text-2xl font-bold text-[#002060] tracking-tighter">NTT DATA</div>
                <div class="text-xs text-gray-500">Trusted Global Innovator</div>
            </div>
        </div>
        <div class="comparison-container">
            <div class="comp-box comp-others">
                <div class="comp-title">他行（メガ・ネット銀）</div>
                <div class="cycle-img">🔄 💰</div>
                <div class="cycle-text">
                    <strong>「経済圏」で稼ぐ</strong><br>
                    決済・証券・保険・EC...<br>
                    多角的な収益源で<br>
                    <span class="text-blue-600 font-bold">拡大再生産</span>
                </div>
            </div>
            <div class="comp-box comp-rokin">
                <div class="comp-title">労働金庫（現状）</div>
                <div class="cycle-img">📉 ✂️</div>
                <div class="cycle-text">
                    <strong>「効率化」で耐える</strong><br>
                    コストは下がるが、<br>
                    新たな収益源がなく<br>
                    <span class="text-red-600 font-bold">縮小均衡（シュリンク）</span>
                </div>
            </div>
        </div>
        <div class="question-overlay">
            労働金庫は、今後「何で」稼ぐのか？
        </div>
        <div class="footer-bar"></div>
        <div class="page-number">3</div>
    </div>
</body>
</html>
