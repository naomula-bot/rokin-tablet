<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今の延長線上に、未来はあるか？</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f0f4f8;
            color: #333;
        }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: white;
            position: relative;
            overflow: hidden;
            padding: 40px 60px 10px 60px;
            box-sizing: border-box;
        }
        .header-bar { position: absolute; top: 0; left: 0; width: 100%; height: 12px; background: linear-gradient(90deg, #002060 0%, #0041C2 100%); }
        .footer-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 8px; background-color: #002060; }
        .page-number { position: absolute; bottom: 12px; right: 20px; font-size: 14px; color: #666; }
        .ntt-logo { position: absolute; top: 30px; right: 40px; width: 100px; height: auto; }
        .main-title {
            font-size: 36px;
            font-weight: 700;
            color: #002060;
            margin-bottom: 10px;
            border-left: 8px solid #e53e3e; /* Red for crisis */
            padding-left: 20px;
            line-height: 1.2;
        }
        .sub-title {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
            padding-left: 28px;
        }
        .waves-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
        }
        .wave-box {
            flex: 1;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }
        .wave-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #718096;
        }
        .wave-title {
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            text-align: center;
        }
        .wave-icon {
            font-size: 40px;
            text-align: center;
            margin-bottom: 15px;
            color: #4a5568;
        }
        .wave-desc {
            font-size: 16px;
            line-height: 1.6;
            color: #4a5568;
        }
        .impact-box {
            margin-top: 15px;
            background-color: #fff5f5;
            padding: 10px;
            border-radius: 4px;
            color: #c53030;
            font-weight: 700;
            text-align: center;
            font-size: 16px;
        }
        .conclusion-box {
            margin-top: 40px;
            background-color: #2d3748;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header-bar"></div>

        <div class="flex justify-between items-start mb-4">
            <div>
                <h1 class="main-title">今の延長線上に、未来はあるか？</h1>
                <p class="sub-title">労働金庫を取り巻く、構造的な「3つの逆風」</p>
            </div>
            <div class="text-right">
                <div class="text-2xl font-bold text-[#002060] tracking-tighter">NTT DATA</div>
                <div class="text-xs text-gray-500">Trusted Global Innovator</div>
            </div>
        </div>
        <div class="waves-container">
            <div class="wave-box">
                <div class="wave-icon">📉</div>
                <div class="wave-title">1. 顧客基盤の縮小</div>
                <div class="wave-desc">
                    人口減少に加え、労働組合の組織率低下が進行。<br>
                    「待っていれば顧客が来る」時代の終焉。
                </div>
                <div class="impact-box">自然減（シュリンク）</div>
            </div>
            <div class="wave-box">
                <div class="wave-icon">🏠</div>
                <div class="wave-title">2. 主力商品の限界</div>
                <div class="wave-desc">
                    住宅ローン市場は頭打ち。<br>
                    ネット銀行との金利競争で、利ざやは極限まで縮小。
                </div>
                <div class="impact-box">収益性の低下</div>
            </div>
            <div class="wave-box">
                <div class="wave-icon">🌐</div>
                <div class="wave-title">3. 新たな競争軸</div>
                <div class="wave-desc">
                    メガバンク等は「経済圏」で顧客を囲い込み。<br>
                    決済・証券・保険など、多角的に収益化。
                </div>
                <div class="impact-box">顧客の流出</div>
            </div>
        </div>
        <div class="conclusion-box">
            「守り（効率化）」だけでは、この逆風には抗えない。
        </div>
        <div class="footer-bar"></div>
        <div class="page-number">2</div>
    </div>
</body>
</html>
